<!doctype html><html lang="de"><head><meta charset="utf-8"><title>CRM Kraft TOTP</title>
<style>body{font-family:sans-serif;max-width:520px;margin:40px auto}input{width:100%;font-size:18px;padding:8px;margin:6px 0 14px}#code{font-size:64px;font-weight:bold;letter-spacing:6px}#left{color:#666}</style></head>
<body><h1>TOTP-Code</h1>
<form autocomplete="off" onsubmit="return false">
<label for="label">Bezeichnung</label><input id="label" name="username" type="text" placeholder="Rolle - Tool - Kunde">
<label for="secret">TOTP Secret</label><input id="secret" name="password" type="password" autocomplete="off">
</form>
<div id="code">------</div><div id="left"></div><div id="err" style="color:#b00"></div>
<script>
function b32(s){s=s.replace(/[\s=-]/g,'').toUpperCase();const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let bits='';for(const c of s){const v=a.indexOf(c);if(v<0)throw'bad';bits+=v.toString(2).padStart(5,'0')}const out=new Uint8Array(Math.floor(bits.length/8));for(let i=0;i<out.length;i++)out[i]=parseInt(bits.substr(i*8,8),2);return out}
async function totp(sec){const key=await crypto.subtle.importKey('raw',b32(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']);const ctr=Math.floor(Date.now()/30000);const buf=new ArrayBuffer(8);const dv=new DataView(buf);dv.setUint32(4,ctr);const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));const o=h[19]&15;const n=((h[o]&127)<<24|h[o+1]<<16|h[o+2]<<8|h[o+3])%1e6;return String(n).padStart(6,'0')}
async function tick(){const s=document.getElementById('secret').value;const left=30-Math.floor(Date.now()/1000)%30;document.getElementById('left').textContent=s?('noch '+left+' s gültig'):'';if(!s){document.getElementById('code').textContent='------';return}try{document.getElementById('code').textContent=await totp(s);document.getElementById('err').textContent=''}catch(e){document.getElementById('err').textContent='Secret ungültig'}}
setInterval(tick,500);document.getElementById('secret').addEventListener('input',tick);
</script></body></html>
